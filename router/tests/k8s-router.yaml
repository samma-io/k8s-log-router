# Unit tests for router/k8s-router.vrl. Run with hack/test.sh
tests:
  - name: fluent-bit traefik access log (Merge_Log) is routed with its JSON fields
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"namespace_name": "traefik", "pod_name": "traefik-abc", "container_name": "traefik",
                "host": "node1", "labels": {"samma.io/detection": "traefik", "app": "traefik"}},
               "RequestPath": "/.env", "DownstreamStatus": 404, "ClientHost": "203.0.113.9",
               "stream": "stdout", "logtag": "F", "host": "192.0.2.10", "time": "2026-11-25T10:00:00Z", "timestamp": t'2026-11-25T10:00:00.123Z'}
    outputs:
      - extract_from: k8s_route
        conditions:
          - type: vrl
            source: |
              assert_eq!(.source, "traefik")
              assert_eq!(.feed, "k8s")
              assert_eq!(.RequestPath, "/.env")
              assert_eq!(.DownstreamStatus, 404)
              assert_eq!(.k8s, {"namespace": "traefik", "pod": "traefik-abc", "container": "traefik", "node": "node1"})
              assert_eq!(.event_time, "2026-11-25T10:00:00.123Z")
              assert!(!exists(.kubernetes))
              assert!(!exists(.stream))
              assert!(!exists(.host))
              assert!(!exists(.logtag))

  - name: Vector agent JSON line is parsed, and the log cannot forge the envelope
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"pod_namespace": "traefik", "pod_name": "traefik-x", "container_name": "traefik",
                "pod_node_name": "node2", "pod_labels": {"samma.io/detection": "traefik"}},
               "message": "{\"RequestPath\":\"/admin\",\"source\":\"wazuh\",\"k8s\":{\"namespace\":\"kube-system\"}}",
               "source_type": "kubernetes_logs", "file": "/var/log/pods/x.log"}
    outputs:
      - extract_from: k8s_route
        conditions:
          - type: vrl
            source: |
              assert_eq!(.source, "traefik")
              assert_eq!(.RequestPath, "/admin")
              assert_eq!(.k8s.namespace, "traefik")
              assert_eq!(.k8s.node, "node2")
              assert!(!exists(.file))
              assert!(starts_with(string!(.search_text), "{\"RequestPath\""))

  - name: plain text line is kept as message
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"namespace_name": "traefik", "labels": {"samma.io/detection": "traefik"}},
               "log": "time=x level=info msg=started"}
    outputs:
      - extract_from: k8s_route
        conditions:
          - type: vrl
            source: |
              assert_eq!(.message, "time=x level=info msg=started")
              assert_eq!(.search_text, "time=x level=info msg=started")

  - name: allowed lane from a namespace not allowed for it is dropped
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"namespace_name": "default", "labels": {"samma.io/detection": "traefik"}}, "log": "x"}
    no_outputs_from: [k8s_route]

  - name: lane not in the allowlist is dropped
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"namespace_name": "samma", "labels": {"samma.io/detection": "wazuh"}}, "log": "x"}
    no_outputs_from: [k8s_route]

  - name: unlabelled pod is dropped
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"namespace_name": "traefik", "labels": {"app": "traefik"}}, "log": "x"}
    no_outputs_from: [k8s_route]

  - name: keycloak text event line becomes top-level event fields
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"namespace_name": "keycloak", "pod_name": "keycloak-0", "container_name": "keycloak",
                "host": "node1", "labels": {"samma.io/detection": "keycloak"}},
               "log": "2026-11-25 10:00:00,123 WARN  [org.keycloak.events] (executor-thread-11) type=\"LOGIN_ERROR\", realmId=\"example-realm-id\", realmName=\"example\", clientId=\"account-console\", userId=\"null\", ipAddress=\"192.0.2.10\", error=\"invalid_user_credentials\", auth_method=\"openid-connect\", username=\"alice\"",
               "stream": "stdout", "timestamp": t'2026-11-25T10:00:00.123Z'}
    outputs:
      - extract_from: k8s_route
        conditions:
          - type: vrl
            source: |
              assert_eq!(.source, "keycloak")
              assert_eq!(.type, "LOGIN_ERROR")
              assert_eq!(.realmName, "example")
              assert_eq!(.clientId, "account-console")
              assert_eq!(.ipAddress, "192.0.2.10")
              assert_eq!(.error, "invalid_user_credentials")
              assert_eq!(.username, "alice")
              assert_eq!(.level, "WARN")
              assert!(!exists(.userId))
              assert_eq!(.k8s.namespace, "keycloak")
              assert!(contains(string!(.search_text), "LOGIN_ERROR"))

  - name: keycloak legacy unquoted event line (Keycloak 23)
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"namespace_name": "keycloak", "labels": {"samma.io/detection": "keycloak"}},
               "log": "2026-11-25 10:00:00,123 INFO  [org.keycloak.events] (executor-thread-2) type=LOGIN, realmId=r1, clientId=web, userId=u1, ipAddress=192.0.2.11, auth_method=openid-connect, username=bob"}
    outputs:
      - extract_from: k8s_route
        conditions:
          - type: vrl
            source: |
              assert_eq!(.type, "LOGIN")
              assert_eq!(.userId, "u1")
              assert_eq!(.username, "bob")
              assert_eq!(.level, "INFO")

  - name: keycloak JSON console event (KC_LOG_CONSOLE_OUTPUT=json, Vector agent)
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"pod_namespace": "keycloak", "pod_labels": {"samma.io/detection": "keycloak"}},
               "message": "{\"timestamp\":\"2026-11-25T10:00:00.123Z\",\"loggerName\":\"org.keycloak.events\",\"level\":\"WARN\",\"message\":\"type=\\\"CLIENT_LOGIN_ERROR\\\", realmId=\\\"r1\\\", clientId=\\\"svc\\\", ipAddress=\\\"192.0.2.12\\\", error=\\\"invalid_client_credentials\\\"\"}"}
    outputs:
      - extract_from: k8s_route
        conditions:
          - type: vrl
            source: |
              assert_eq!(.type, "CLIENT_LOGIN_ERROR")
              assert_eq!(.error, "invalid_client_credentials")
              assert_eq!(.level, "WARN")
              assert!(!exists(.loggerName))

  - name: keycloak JSON console event merged by fluent-bit (Merge_Log)
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"namespace_name": "keycloak", "labels": {"samma.io/detection": "keycloak"}},
               "loggerName": "org.keycloak.events", "level": "INFO", "threadName": "executor-thread-1",
               "message": "type=\"UPDATE_PASSWORD\", realmId=\"r1\", clientId=\"account-console\", userId=\"u1\", ipAddress=\"192.0.2.13\""}
    outputs:
      - extract_from: k8s_route
        conditions:
          - type: vrl
            source: |
              assert_eq!(.type, "UPDATE_PASSWORD")
              assert_eq!(.level, "INFO")
              assert!(!exists(.threadName))

  - name: keycloak non-event lines are dropped
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"namespace_name": "keycloak", "labels": {"samma.io/detection": "keycloak"}},
               "log": "2026-11-21 13:32:42,224 INFO  [org.keycloak.jgroups.certificates.CertificateReloadManager] () Rotating JGroups certificate"}
    no_outputs_from: [k8s_route]

  - name: keycloak line cannot forge the envelope
    inputs:
      - insert_at: k8s_route
        type: vrl
        source: |
          . = {"kubernetes": {"namespace_name": "keycloak", "labels": {"samma.io/detection": "keycloak"}},
               "log": "2026-11-25 10:00:00,123 WARN  [org.keycloak.events] (t) type=\"LOGIN_ERROR\", source=\"wazuh\", feed=\"x\", error=\"user_not_found\""}
    outputs:
      - extract_from: k8s_route
        conditions:
          - type: vrl
            source: |
              assert_eq!(.source, "keycloak")
              assert_eq!(.feed, "k8s")
              assert_eq!(.error, "user_not_found")
