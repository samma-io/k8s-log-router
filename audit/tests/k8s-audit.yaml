# Unit tests for audit/k8s-audit.vrl. Run with hack/test.sh
tests:
- name: exec into a pod (verb get on 1.30+) is kept with the envelope
  inputs:
  - insert_at: k8s_audit
    type: log
    log_fields:
      message: '{"kind": "Event", "apiVersion": "audit.k8s.io/v1", "level": "Metadata", "auditID": "00000000-test", "stage": "ResponseComplete", "requestURI": "/api/v1/namespaces/default/pods/app-0", "verb":
        "get", "user": {"username": "developer@example.com", "groups": ["system:authenticated"]}, "sourceIPs": ["192.0.2.10"], "userAgent": "kubectl/v1.33.0", "objectRef": {"resource": "pods", "namespace":
        "default", "name": "app-0", "apiVersion": "v1", "subresource": "exec"}, "responseStatus": {"metadata": {}, "code": 101}, "requestReceivedTimestamp": "2026-11-25T10:00:00.123456Z", "stageTimestamp":
        "2026-11-25T10:00:00.200000Z"}'
  outputs:
  - extract_from: k8s_audit
    conditions:
    - type: vrl
      source: 'assert_eq!(.source, "k8s")

        assert_eq!(.feed, "audit")

        assert_eq!(.kind, "Event")

        assert_eq!(.objectRef.subresource, "exec")

        assert_eq!(.event_time, "2026-11-25T10:00:00.123Z")

        assert_eq!(.search_text, "get pods/exec default/app-0 by developer@example.com -> 101")

        assert!(!exists(.message))'
- name: secret read is kept
  inputs:
  - insert_at: k8s_audit
    type: log
    log_fields:
      message: '{"kind": "Event", "apiVersion": "audit.k8s.io/v1", "level": "Metadata", "auditID": "00000000-test", "stage": "ResponseComplete", "requestURI": "/api/v1/namespaces/argocd/secrets/repo", "verb":
        "get", "user": {"username": "system:serviceaccount:argocd:argocd-application-controller", "groups": ["system:authenticated"]}, "sourceIPs": ["192.0.2.10"], "userAgent": "kubectl/v1.33.0", "objectRef":
        {"resource": "secrets", "namespace": "argocd", "name": "repo", "apiVersion": "v1"}, "responseStatus": {"metadata": {}, "code": 200}, "requestReceivedTimestamp": "2026-11-25T10:00:00.123456Z", "stageTimestamp":
        "2026-11-25T10:00:00.200000Z"}'
  outputs:
  - extract_from: k8s_audit
    conditions:
    - type: vrl
      source: assert_eq!(.objectRef.resource, "secrets")
- name: rolebinding create keeps its requestObject
  inputs:
  - insert_at: k8s_audit
    type: log
    log_fields:
      message: '{"kind": "Event", "apiVersion": "audit.k8s.io/v1", "level": "Metadata", "auditID": "00000000-test", "stage": "ResponseComplete", "requestURI": "/api/v1/namespaces/None/clusterrolebindings/pwn",
        "verb": "create", "user": {"username": "developer@example.com", "groups": ["system:authenticated"]}, "sourceIPs": ["192.0.2.10"], "userAgent": "kubectl/v1.33.0", "objectRef": {"resource": "clusterrolebindings",
        "name": "pwn", "apiVersion": "v1"}, "responseStatus": {"metadata": {}, "code": 200}, "requestReceivedTimestamp": "2026-11-25T10:00:00.123456Z", "stageTimestamp": "2026-11-25T10:00:00.200000Z", "requestObject":
        {"roleRef": {"name": "cluster-admin"}}, "responseObject": {"big": "x"}}'
  outputs:
  - extract_from: k8s_audit
    conditions:
    - type: vrl
      source: 'assert_eq!(.requestObject.roleRef.name, "cluster-admin")

        assert!(!exists(.responseObject))

        assert_eq!(.search_text, "create clusterrolebindings pwn by developer@example.com -> 200")'
